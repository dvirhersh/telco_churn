fitness_function:
  type: ExternalFitnessFunction

ai1:
  ga:
    population_size: 50
    elite_percentage: 0.2
    mutation_percentage: 0.2
    unique_mutation_percentage: 0
    recalculate_elite_fitness: false
  flow_control:
    minimum_problem_sufficient_fitness: 0.01
    max_constant_loops: -1
    max_stagnation_loops: 10
    max_drifts_with_no_change: 10
    steady_threshold: 0.001
    how_many_generations_look_back_for_local_optimization: -1
    how_many_generations_look_back: 50
    generation_to_start_check_steady_state: 1000
    time_limit: -1
  cumulative_genetic_drift:
    chosen_drifts_names:
      - genesis_crossover_drift
      - genesis_genetic_drift
      - mutation_genetic_drift
  genesis_genetic_drift:
    drift_fraction: 0.2
  mutation_genetic_drift:
    drift_fraction: 0.2
    drift_factor: 2
  genesis_crossover_drift:
    drift_fraction: 0.2
  mutation_pool:
    type: DefaultMutationPoolCreator
  crossover_pool:
    type: DefaultCrossoverPoolCreator
    min_fitness_value: 0
    max_fitness_value: 1
  is_maximum_problem: true
  generate_final_mutations: false
ai2:
  output: {}

chromosome:
  type: dict
  generation:
    type: per_item
    non_required_probability: 0
  mutation:
    type: random
    percentage_to_mutate: 0.15
    max_percentage_to_mutate: 0.25
    num_items_to_mutate: 2
    max_num_items_to_mutate: 3
    drift_factor: 1.1
  crossover:
    type: per_item_crossover
    per_item_select_strategy: random
  content:

    # ── routing ───────────────────────────────────────────────────────────────
    # Nested dict gene encoding a developmental routing hypothesis.
    # Each chromosome answers: "How should the population be partitioned before
    # discovering behavioral profiles?"
    #
    # MOXO features are age- and gender-normalized percentiles, so routing does
    # not compensate for score distributions — it defines which behavioral space
    # is learned.
    #
    # DESIGN PRINCIPLE: a chromosome gene must represent an independently
    # meaningful scientific hypothesis.  The old two-gene design (routing_strategy
    # × developmental_schema = 16 combos) produced 8 phantom combinations that
    # map to identical phenotypes and waste evolution compute.  The single
    # hypothesis gene (8 values) encodes the complete scientific claim — routing
    # strategy and developmental schema jointly — with zero wasted combinations.
    #
    # Active thresholds per hypothesis (inactive thresholds remain in genome but
    # are canonicalized to null in resolved_parameters.json):
    #   global                → no thresholds active
    #   gender                → no thresholds active
    #   age_binary            → shared_child_threshold
    #   age_ternary           → shared_child + shared_adolescent
    #   age_gender_binary     → shared_child_threshold
    #   age_gender_ternary    → shared_child + shared_adolescent
    #   age_gender_binary_sex → male_child + female_child
    #   age_gender_ternary_sex→ male_child + male_adolescent + female_child + female_adolescent
    #
    # Backward compatibility: omitting this block → age_binary, shared_child_threshold=12.
    routing:
      type: dict
      generation: { type: per_item, non_required_probability: 0 }
      mutation:   { type: random, percentage_to_mutate: 0.3 }
      crossover:  { type: per_item_crossover }
      content:

        # Complete developmental routing hypothesis — replaces routing_strategy +
        # developmental_schema (previously 4×4=16 combinations, 8 of which were phantom).
        # Each value is a distinct, independently valid scientific claim about how
        # the ADHD population should be partitioned before discovering behavioral profiles.
        hypothesis:
          type: enum
          values:
            - global                  # No partitioning; single unified behavioral space
            - gender                  # Two spaces: male / female
            - age_binary              # Two spaces: child / adult  (shared threshold)
            - age_ternary             # Three spaces: child / adolescent / adult  (shared)
            - age_gender_binary       # 4 spaces: age_binary × gender  (shared threshold)
            - age_gender_ternary      # 6 spaces: age_ternary × gender  (shared thresholds)
            - age_gender_binary_sex   # 4 spaces: age_binary × gender  (sex-differentiated)
            - age_gender_ternary_sex  # 6 spaces: age_ternary × gender  (sex-differentiated)
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # ── Shared (sex-agnostic) thresholds ──────────────────────────────────
        # binary:  age <= shared_child_threshold → "child", else → "adult"
        # ternary: age <= shared_child_threshold → "child" (continues below)
        shared_child_threshold:
          type: int
          min_value: 8
          max_value: 16
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # ternary: shared_child_threshold < age <= shared_adolescent_threshold → "adolescent"
        # Decoder enforces: shared_adolescent_threshold > shared_child_threshold
        shared_adolescent_threshold:
          type: int
          min_value: 14
          max_value: 19
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # ── Male thresholds ───────────────────────────────────────────────────
        # gender_binary:  male age <= male_child_threshold → "child", else → "adult"
        # gender_ternary: male age <= male_child_threshold → "child" (continues below)
        male_child_threshold:
          type: int
          min_value: 8
          max_value: 14
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # gender_ternary: male_child_threshold < age <= male_adolescent_threshold → "adolescent"
        # Decoder enforces: male_adolescent_threshold > male_child_threshold
        male_adolescent_threshold:
          type: int
          min_value: 14
          max_value: 19
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # ── Female thresholds ─────────────────────────────────────────────────
        # gender_binary:  female age <= female_child_threshold → "child", else → "adult"
        # gender_ternary: female age <= female_child_threshold → "child" (continues below)
        female_child_threshold:
          type: int
          min_value: 8
          max_value: 15
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # gender_ternary: female_child_threshold < age <= female_adolescent_threshold → "adolescent"
        # Decoder enforces: female_adolescent_threshold > female_child_threshold
        female_adolescent_threshold:
          type: int
          min_value: 13
          max_value: 18
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

    # ── behavioral geometry ───────────────────────────────────────────────────
    # Nested dict gene (verified accepted by Earth: POST /api/evl/chromosome/validate).
    # Groups geometry_family, distance_metric, centroid_algorithm, cluster_resolution,
    # gmm_covariance, and assignment_mode.
    #
    # centroid_algorithm is only active when geometry_family=centroid.
    # For graph→spectral and hierarchy→agglomerative the decoder derives the actual
    # algorithm from the family, and canonicalizes gmm_covariance=null + assignment_mode=hard.
    # These canonicalized values are visible in resolved_parameters.json and pipeline_config.yaml.
    #
    # Three supported families (density removed — benchmark shows 70–99% noise
    # on uniform-density MOXO feature space; see earth/benchmark_geometry.py):
    #   centroid  → centroid_algorithm: kmeans | gmm  → cluster_resolution = n_clusters
    #   graph     → algorithm: spectral               → cluster_resolution = n_clusters
    #   hierarchy → algorithm: agglomerative          → cluster_resolution = n_clusters
    #
    # Backward compatibility: family=centroid + metric=euclidean + centroid_algorithm=kmeans
    # reproduces the current pipeline behaviour exactly.
    behavioral_geometry:
      type: dict
      generation: { type: per_item, non_required_probability: 0 }
      mutation:   { type: random, percentage_to_mutate: 0.3 }
      crossover:  { type: per_item_crossover }
      content:

        # Which mathematical model describes behavioral organization.
        # density family removed: HDBSCAN/OPTICS produce 70–99% noise on this dataset
        # (uniform-density percentile-score feature space; no natural density gaps).
        geometry_family:
          type: enum
          values:
            - centroid    # Behavior organized around compact prototypes (KMeans, GMM)
            - graph       # Behavior organized as similarity neighborhoods (Spectral)
            - hierarchy   # Behavior develops through nested phenotypes (Agglomerative)
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # How behavioral similarity between patients is measured.
        distance_metric:
          type: enum
          values:
            - euclidean    # Baseline; isotropic feature space
            - manhattan    # Robust to outliers; preserves axis-wise differences
            - cosine       # Measures pattern shape rather than magnitude
            - correlation  # Pattern similarity independent of overall level
            - mahalanobis  # Accounts for feature covariance (regularised VI)
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # Centroid-family algorithm — only used when geometry_family=centroid.
        # For graph→spectral and hierarchy→agglomerative the actual algorithm is
        # derived from the family; this gene is ignored in those cases.
        centroid_algorithm:
          type: enum
          values:
            - kmeans
            - gmm
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # Number of clusters. Maps to n_clusters for all remaining families.
        cluster_resolution:
          type: int
          min_value: 2
          max_value: 20
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # GMM covariance structure — only meaningful when the resolved algorithm is gmm
        # (centroid family + centroid_algorithm=gmm). The decoder canonicalizes to null
        # for all other algorithms; visible in resolved_parameters.json and pipeline_config.yaml.
        gmm_covariance:
          type: enum
          values:
            - full
            - tied
            - diag
            - spherical
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # Assignment mode — soft is only valid for gmm. The decoder canonicalizes to
        # hard for all other algorithms; recorded in clamp_notes on the Phenotype.
        assignment_mode:
          type: enum
          values:
            - hard
            - soft
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

    # ── representation ────────────────────────────────────────────────────────
    # Nested dict gene grouping the 6 representation genes: family, PCA settings,
    # and per-group feature weights. Genes crossover together, preserving semantic
    # coherence (pca_n_components only active when pca_enabled=true;
    # weight_component_modalities inactive for derived-index family).
    #
    # Backward compatibility: flat top-level representation_family, pca_*, weight_*
    # genes are read with fallbacks in adapter.py and fitness.py.
    representation:
      type: dict
      generation: { type: per_item, non_required_probability: 0 }
      mutation:   { type: random, percentage_to_mutate: 0.3 }
      crossover:  { type: per_item_crossover }
      content:

        # hybrid/direct: all 25 features. derived-index: 10 global + component totals.
        family:
          type: enum
          values:
            - hybrid
            - direct
            - derived-index
          generation: { type: uniform }
          mutation:   { type: random }
          crossover:  { type: error }

        # Whether to reduce dimensionality with PCA before clustering.
        pca_enabled:
          type: bool

        # Number of PCA components to retain (only active when pca_enabled=true).
        pca_n_components:
          type: int
          min_value: 2
          max_value: 12
          generation: { type: uniform }
          mutation:
            step_size: 1
            percentage_change: 0.2
          crossover: { type: random }

        # ── Feature weights ──────────────────────────────────────────────────
        # Multipliers applied per feature group after StandardScaler, before PCA.
        # 1.0 = neutral. Range 0.5–2.0 keeps search space narrow for Phase 3.
        weight_global:
          type: float
          min_value: 0.5
          max_value: 2.0
          generation: { type: uniform }
          mutation:
            percentage_change: 0.2
          crossover: { type: random }

        weight_component_totals:
          type: float
          min_value: 0.5
          max_value: 2.0
          generation: { type: uniform }
          mutation:
            percentage_change: 0.2
          crossover: { type: random }

        # Only active for hybrid/direct families (not derived-index).
        weight_component_modalities:
          type: float
          min_value: 0.5
          max_value: 2.0
          generation: { type: uniform }
          mutation:
            percentage_change: 0.2
          crossover: { type: random }

    # Distance percentile above which a patient is flagged as an anomaly.
    anomaly_distance_percentile:
      type: float
      min_value: 90.0
      max_value: 99.9
      generation:
        type: uniform
      mutation:
        percentage_change: 0.05
      crossover:
        type: random
