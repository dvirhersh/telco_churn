fitness_function:
  type: ExternalFitnessFunction
chromosome:
  type: dict
  generation:
    type: per_item
    non_required_probability: 0
  mutation:
    type: random
    percentage_to_mutate: 0.1
    max_percentage_to_mutate: 0.2
    num_items_to_mutate: 1
    max_num_items_to_mutate: 2
    drift_factor: 1.1
  crossover:
    type: per_item_crossover
    per_item_select_strategy: random
  content:
    feature_mask:
      type: array
      min_size: 19
      max_size: 19
      consecutive: false
      item_definition:
        type: bool
      generation:
        type: per_item
      mutation:
        type: random
        percentage_to_mutate: 0.1
        max_percentage_to_mutate: 0.1
        num_items_to_mutate: 1
        max_num_items_to_mutate: 1
        drift_factor: 1.1
      crossover:
        type: per_item_crossover
        per_item_select_strategy: random
    encoding:
      type: enum
      values:
        - onehot
        - ordinal
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    scaler:
      type: enum
      values:
        - none
        - standard
        - minmax
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    class_weight:
      type: enum
      values:
        - none
        - balanced
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    model_family:
      type: enum
      values:
        - logistic_regression
        - random_forest
        - xgboost
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    lr_C_exponent:
      type: float
      min_value: -2
      max_value: 2
      generation:
        type: uniform
      mutation:
        step_size: 0.2
        max_step_size: 0.5
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    lr_penalty:
      type: enum
      values:
        - l1
        - l2
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    rf_n_estimators:
      type: int
      min_value: 100
      max_value: 500
      generation:
        type: uniform
      mutation:
        step_size: 20
        max_step_size: 50
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    rf_max_depth_unbounded:
      type: bool
    rf_max_depth_value:
      type: int
      min_value: 3
      max_value: 12
      generation:
        type: uniform
      mutation:
        step_size: 1
        max_step_size: 2
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    rf_min_samples_leaf_exponent:
      type: float
      min_value: 0
      max_value: 2
      generation:
        type: uniform
      mutation:
        step_size: 0.1
        max_step_size: 0.3
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    rf_max_features:
      type: enum
      values:
        - sqrt
        - log2
      generation:
        type: uniform
      mutation:
        type: random
      crossover:
        type: error
    xgb_n_estimators:
      type: int
      min_value: 50
      max_value: 500
      generation:
        type: uniform
      mutation:
        step_size: 20
        max_step_size: 50
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    xgb_learning_rate_exponent:
      type: float
      min_value: -2
      max_value: -0.523
      generation:
        type: uniform
      mutation:
        step_size: 0.1
        max_step_size: 0.3
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    xgb_max_depth:
      type: int
      min_value: 2
      max_value: 8
      generation:
        type: uniform
      mutation:
        step_size: 1
        max_step_size: 2
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    xgb_min_child_weight_exponent:
      type: float
      min_value: 0
      max_value: 2
      generation:
        type: uniform
      mutation:
        step_size: 0.1
        max_step_size: 0.3
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    xgb_subsample:
      type: float
      min_value: 0.6
      max_value: 1
      generation:
        type: uniform
      mutation:
        step_size: 0.05
        max_step_size: 0.1
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
    xgb_colsample_bytree:
      type: float
      min_value: 0.6
      max_value: 1
      generation:
        type: uniform
      mutation:
        step_size: 0.05
        max_step_size: 0.1
        percentage_change: 0
        max_magnitude: 0
        drift_factor: 1.1
      crossover:
        type: range_uniform
ai1:
  ga:
    population_size: 20
    elite_percentage: 0.05
    mutation_percentage: 0.15
    unique_mutation_percentage: 0
    recalculate_elite_fitness: false
  flow_control:
    minimum_problem_sufficient_fitness: 0.01
    max_constant_loops: -1
    max_stagnation_loops: 5
    max_drifts_with_no_change: 3
    steady_threshold: 0.001
    how_many_generations_look_back_for_local_optimization: -1
    how_many_generations_look_back: 11
    generation_to_start_check_steady_state: 10
    time_limit: -1
  cumulative_genetic_drift:
    chosen_drifts_names:
      - genesis_crossover_drift
      - genesis_genetic_drift
      - mutation_genetic_drift
  genesis_genetic_drift:
    drift_fraction: 0.2
  mutation_genetic_drift:
    drift_fraction: 0.2
    drift_factor: 2
  genesis_crossover_drift:
    drift_fraction: 0.2
  mutation_pool:
    type: DefaultMutationPoolCreator
  crossover_pool:
    type: DefaultCrossoverPoolCreator
    min_fitness_value: 0.00001
    max_fitness_value: 100000
  is_maximum_problem: true
  generate_final_mutations: false
ai2:
  output: {}
